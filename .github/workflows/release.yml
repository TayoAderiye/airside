name: Release

# Tag-driven, and only tags. A release is a deliberate act with a version number
# attached — publishing on every push to main would mean the tag Airside's own
# updater rolls back to could move under it.
on:
  push:
    tags: ['v*.*.*']

  # Available by hand so the first image can be pushed and pulled before anything
  # is tagged. It builds and pushes the same way; only the trigger differs.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

  # The only extra grant, and it is scoped to this workflow rather than the
  # repository default.
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    # The same gates as CI, re-run against the tagged commit. A release must not
    # be able to skip them by being tagged from a branch CI never saw.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Docker is present on the runner, so the integration tests must not be
        # allowed to skip silently — a broken daemon would otherwise let the
        # network isolation test quietly disappear from a release build.
        env:
          AIRSIDE_REQUIRE_DOCKER: '1'
        run: dotnet test --no-build -c Release

  prepare:
    # Version and owner are worked out once. With a build matrix they would
    # otherwise be recomputed per architecture, and a mismatch between two
    # supposedly identical answers is not a failure anyone would think to look for.
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # The version in the tag has to match the one compiled into the binary,
          # or `airside status` reports a version the image is not, and the
          # updater compares against the wrong thing.
          declared=$(grep -oE '<VersionPrefix>[^<]+' Directory.Build.props | cut -d'>' -f2)

          if [ "$version" != "$declared" ]; then
            echo "Tag says $version but Directory.Build.props says $declared." >&2
            echo "Update VersionPrefix and deploy/install.sh together, then retag." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A ghcr repository name must be lowercase and a GitHub account need not
          # be, so the owner is folded here rather than interpolated directly.
          # Actions expressions have no lowercase function, hence shell.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    # One job per architecture, each on its own native runner. The alternative is
    # QEMU emulation on a single amd64 host, and a .NET publish under emulation is
    # slow enough to be its own problem — several times the wall clock, for a build
    # that already runs on every release.
    #
    # Each job pushes an untagged image and reports its digest; nothing is tagged
    # until both have succeeded, so a half-published multi-arch tag cannot exist.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        id: platform
        run: echo "pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/airside,push-by-digest=true,name-canonical=true,push=true

          # Per-architecture cache. Sharing one scope between them makes each run
          # evict the other's layers, which costs more than the cache saves.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Hand the digest to the merge step
        run: |
          # The "sha256:" prefix is stripped because upload-artifact rejects a
          # colon in a filename, and the merge step reassembles the reference as
          # image@sha256:<name>. Leaving it on fails after the image has already
          # been pushed, which looks like a build failure and is not one.
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    # The tag is created here, from both digests at once. Until this runs, the
    # images exist in the registry but no tag points at them — so a failure in
    # either architecture leaves the previous release untouched rather than
    # publishing a tag that resolves on one platform and not the other.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/airside"

          # No ":latest". Airside's updater rewrites an explicit tag and rolls back
          # by digest; a floating tag would make "the previous version" meaningless,
          # and a routine restart could become an unplanned upgrade.
          docker buildx imagetools create \
            --tag "$image:${{ needs.prepare.outputs.version }}" \
            $(printf "$image@sha256:%s " *)

      - name: Confirm both architectures are present and the image runs
        run: |
          image="${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/airside:${{ needs.prepare.outputs.version }}"

          # A published image that will not start is the worst possible release,
          # and the installer is the only other thing that would find out.
          docker buildx imagetools inspect "$image"

          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' \
              | grep -q "\"architecture\":\"$arch\"" \
              || { echo "$image has no linux/$arch entry"; exit 1; }
          done

          docker run --rm --platform linux/amd64 --entrypoint dotnet "$image" Airside.Api.dll --version || true
          echo "Published $image for linux/amd64 and linux/arm64"
