name: Release

# Tag-driven, and only tags. A release is a deliberate act with a version number
# attached — publishing on every push to main would mean the tag Airside's own
# updater rolls back to could move under it.
on:
  push:
    tags: ['v*.*.*']

  # Available by hand so the first image can be pushed and pulled before anything
  # is tagged. It builds and pushes the same way; only the trigger differs.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

  # The only extra grant, and it is scoped to this workflow rather than the
  # repository default.
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    # The same gates as CI, re-run against the tagged commit. A release must not
    # be able to skip them by being tagged from a branch CI never saw.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Docker is present on the runner, so the integration tests must not be
        # allowed to skip silently — a broken daemon would otherwise let the
        # network isolation test quietly disappear from a release build.
        env:
          AIRSIDE_REQUIRE_DOCKER: '1'
        run: dotnet test --no-build -c Release

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # The version in the tag has to match the one compiled into the binary,
          # or `airside status` reports a version the image is not, and the
          # updater compares against the wrong thing.
          declared=$(grep -oE '<VersionPrefix>[^<]+' Directory.Build.props | cut -d'>' -f2)

          if [ "$version" != "$declared" ]; then
            echo "Tag says $version but Directory.Build.props says $declared." >&2
            echo "Update VersionPrefix and deploy/install.sh together, then retag." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A ghcr repository name must be lowercase and a GitHub account need not
          # be, so the owner is folded here rather than interpolated directly.
          # Actions expressions have no lowercase function, which is why this is a
          # shell step and not ${{ }}.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true

          tags: ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/airside:${{ steps.version.outputs.version }}

          # No ":latest". Airside's updater rewrites an explicit tag and rolls
          # back by digest; a floating tag would make "the previous version"
          # meaningless, and a routine restart could become an unplanned upgrade.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the pushed image runs
        run: |
          # A published image that will not start is the worst possible release,
          # and the installer is the only other thing that would find out.
          image="${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/airside:${{ steps.version.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint dotnet "$image" Airside.Api.dll --version || true
          echo "Pulled and executed $image"
